<html lang="sr">
<head>
<meta charset="utf-8">

<title>Blagoje Bistro</title>
<meta name="description" content="Blagoje Bistro, Banovo Brdo — demo QR stranice na 10 jezika.">
<meta name="theme-color" content="#F4F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<!-- premium-kit -->
<link rel="stylesheet" href="../../assets/premium/fonts/fonts.css">
<link rel="stylesheet" href="../../assets/premium/premium.css">
<style>
:root{
  --paper:#F4F1EB; --ink:#181512; --muted:#5C5650; --raise:#FFFFFF;
  --zelena:#2F5D4E; --zlato:#9A6B12; --line:#E2DCD2; --senka:rgba(24,21,18,.08);
  --scrim-a:rgba(10,9,8,.08); --scrim-b:rgba(10,9,8,.78); --g:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema]){
    --paper:#121110; --ink:#F1ECE3; --muted:#A59C8F; --raise:#1B1917;
    --zelena:#7FBBA4; --zlato:#D9A441; --line:#2B2621; --senka:rgba(0,0,0,.45);
    --scrim-a:rgba(6,5,5,.2); --scrim-b:rgba(6,5,5,.85);
  }
}
:root[data-theme="dark"]:not([data-tema]){
  --paper:#121110; --ink:#F1ECE3; --muted:#A59C8F; --raise:#1B1917;
  --zelena:#7FBBA4; --zlato:#D9A441; --line:#2B2621; --senka:rgba(0,0,0,.45);
  --scrim-a:rgba(6,5,5,.2); --scrim-b:rgba(6,5,5,.85);
}
:root[data-tema="dark"]{
  --paper:#121110; --ink:#F1ECE3; --muted:#A59C8F; --raise:#1B1917;
  --zelena:#7FBBA4; --zlato:#D9A441; --line:#2B2621; --senka:rgba(0,0,0,.45);
  --scrim-a:rgba(6,5,5,.2); --scrim-b:rgba(6,5,5,.85);
}
:root[data-tema="light"]{
  --paper:#F4F1EB; --ink:#181512; --muted:#5C5650; --raise:#FFFFFF;
  --zelena:#2F5D4E; --zlato:#9A6B12; --line:#E2DCD2; --senka:rgba(24,21,18,.08);
  --scrim-a:rgba(10,9,8,.08); --scrim-b:rgba(10,9,8,.78);
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font-family:Archivo,"Noto Sans","Segoe UI",system-ui,-apple-system,
    "Noto Sans Arabic","Noto Naskh Arabic","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.5;
  transition:background-color .3s ease,color .3s ease;
}
.omot{max-width:640px; margin:0 auto}
.pad{padding-inline:var(--g)}

.hero{position:relative; min-height:clamp(290px,60vw,400px); display:flex; align-items:flex-end; overflow:hidden}
.hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hero::after{content:""; position:absolute; inset:0;
  background:linear-gradient(to bottom,var(--scrim-a) 0%,var(--scrim-b) 100%)}
.hero-t{position:relative; z-index:1; width:100%; padding-block:0 22px}
.hero h1{margin:0; font-size:clamp(32px,10vw,46px); font-weight:700; letter-spacing:-.03em;
  line-height:1.02; color:#FCFAF6; text-shadow:0 2px 18px rgba(0,0,0,.5)}
.kraj-adresa{margin:5px 0 0; font-size:13px; letter-spacing:.15em; text-transform:uppercase;
  color:rgba(252,250,246,.85); text-shadow:0 1px 12px rgba(0,0,0,.45)}

.alatke{display:flex; gap:9px; margin-top:16px}
.jez{flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
  border:1px solid var(--line); background:var(--raise); border-radius:11px;
  padding:9px 12px; box-shadow:0 1px 2px var(--senka)}
.jez svg{flex:0 0 auto; width:17px; height:17px; stroke:var(--zlato); fill:none; stroke-width:1.7}
.jez label{font-size:11px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; white-space:nowrap}
.jez select{flex:1 1 auto; min-width:0; appearance:none; background:transparent; border:none;
  color:var(--ink); font:inherit; font-size:15px; font-weight:600; cursor:pointer}
.jez select:focus{outline:none}
.jez:focus-within{border-color:var(--zlato)}
.tema{flex:0 0 auto; width:46px; display:grid; place-items:center; cursor:pointer; color:var(--ink);
  border:1px solid var(--line); background:var(--raise); border-radius:11px; box-shadow:0 1px 2px var(--senka)}
.tema svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round}
.tema .mesec{display:none}
:root[data-tema="dark"] .tema .sunce,:root[data-theme="dark"]:not([data-tema]) .tema .sunce{display:none}
:root[data-tema="dark"] .tema .mesec,:root[data-theme="dark"]:not([data-tema]) .tema .mesec{display:block}
@media (prefers-color-scheme: dark){
  :root:not([data-tema]) .tema .sunce{display:none}
  :root:not([data-tema]) .tema .mesec{display:block}
}
.tema:focus-visible,.jez select:focus-visible,a:focus-visible{outline:2px solid var(--zlato); outline-offset:2px}

.znacka{display:inline-flex; align-items:center; gap:6px; margin-top:14px;
  font-size:12px; font-weight:600; letter-spacing:.04em;
  color:var(--zelena); border:1px solid var(--zelena); border-radius:99px; padding:5px 11px}
.znacka svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

h2{margin:0 0 14px; font-size:12px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--zlato)}
section{margin-top:38px}

.podaci{display:flex; flex-direction:column; gap:0; border:1px solid var(--line);
  border-radius:13px; background:var(--raise); overflow:hidden; box-shadow:0 1px 3px var(--senka)}
.stavka{display:flex; gap:13px; padding:13px 15px; border-bottom:1px solid var(--line); align-items:flex-start}
.stavka:last-child{border-bottom:none}
.stavka svg{flex:0 0 auto; width:18px; height:18px; stroke:var(--zelena); fill:none; stroke-width:1.7; margin-top:2px}
.stavka-t{flex:1 1 auto; min-width:0}
.oznaka{display:block; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.vrednost{display:block; font-size:15px; font-weight:500; margin-top:1px; overflow-wrap:anywhere}
.vrednost a{color:var(--ink)}
.dva{display:flex; justify-content:space-between; gap:12px; font-size:14.5px; margin-top:3px}
.dva span:first-child{color:var(--muted)}
.dva span:last-child{font-variant-numeric:tabular-nums; font-weight:600}

.meni-prazan{border:1.5px dashed var(--line); border-radius:13px; padding:26px 20px; text-align:center}
.meni-prazan .veliko{margin:0; font-size:19px; font-weight:700; letter-spacing:-.01em}
.meni-prazan p{margin:9px auto 0; max-width:42ch; font-size:14.5px; color:var(--muted)}
.qr{width:52px; height:52px; margin:0 auto 14px; display:block; stroke:var(--zlato); fill:none; stroke-width:1.6}

.dogadjaji{display:grid; gap:10px}
.dog{display:flex; align-items:center; gap:13px; border:1px solid var(--line); background:var(--raise);
  border-radius:12px; padding:13px 15px; box-shadow:0 1px 2px var(--senka)}
.dog svg{flex:0 0 auto; width:20px; height:20px; stroke:var(--zelena); fill:none; stroke-width:1.7}
.dog b{display:block; font-size:15.5px; font-weight:600}
.dog span{display:block; font-size:13px; color:var(--muted)}

.galerija{display:grid; grid-template-columns:repeat(2,1fr); gap:9px}
.galerija img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:11px; display:block; max-width:100%}
.galerija img:first-child{grid-column:1 / -1; aspect-ratio:16/10}

.dno{margin-top:46px; padding-block:18px 48px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--muted)}
.dno a{color:var(--zlato)}

@supports (animation-timeline: view()){
  @media (prefers-reduced-motion: no-preference){
    section{animation:ulaz linear both; animation-timeline:view(); animation-range:entry 0% entry 40%}
    .hero img{animation:zum linear both; animation-timeline:view(); animation-range:exit 0% exit 100%}
    .hero-t{animation:bledi linear both; animation-timeline:view(); animation-range:exit 0% exit 100%}
  }
}
@keyframes ulaz{from{opacity:.2; transform:translateY(16px)}to{opacity:1; transform:none}}
@keyframes zum{from{transform:scale(1)}to{transform:scale(1.09)}}
@keyframes bledi{from{opacity:1}to{opacity:.3; transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
(function () {
  var D = JSON.parse(document.getElementById("podaci").textContent);
  var koren = document.documentElement, kodovi = D.jezici.map(function(j){return j.k;});
  function citaj(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function pisi(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  document.getElementById("hero-img").src = D.slike.hero;
  var g = document.getElementById("galerija");
  ["ulaz","basta","terasa","sala"].forEach(function(n){
    var i = document.createElement("img");
    i.src = D.slike[n]; i.alt = ""; i.loading = "lazy";
    g.appendChild(i);
  });

  var st = citaj("blagoje-tema");
  if (st === "light" || st === "dark") koren.setAttribute("data-tema", st);
  function tamna(){
    var t = koren.getAttribute("data-tema");
    if (t) return t === "dark";
    if (koren.getAttribute("data-theme") === "dark") return true;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  var bTema = document.getElementById("tema"), jezik = "sr";
  bTema.addEventListener("click", function(){
    var n = tamna() ? "light" : "dark";
    koren.setAttribute("data-tema", n); pisi("blagoje-tema", n); natpisTeme();
  });
  function natpisTeme(){
    var t = tamna() ? D.ui.tema_svetla : D.ui.tema_tamna;
    bTema.setAttribute("aria-label", t[jezik] || t.sr);
    bTema.setAttribute("title", t[jezik] || t.sr);
  }

  var sel = document.getElementById("jezik");
  D.jezici.forEach(function(j){
    var o = document.createElement("option"); o.value = j.k; o.textContent = j.ime; sel.appendChild(o);
  });
  function pocetni(){
    var s = citaj("blagoje-jezik");
    if (s && kodovi.indexOf(s) > -1) return s;
    var l = navigator.languages || [navigator.language || "sr"];
    for (var i=0;i<l.length;i++){
      var k = String(l[i]).slice(0,2).toLowerCase();
      if (kodovi.indexOf(k) > -1) return k;
    }
    return "sr";
  }
  var mapa = {
    "ozn-jezik":"jezik","o-adresa":"adresa_ozn","o-radno":"radno_ozn","o-telefon":"telefon_ozn",
    "d-nedcet":"ned_cet","d-petsub":"pet_sub","h-meni":"meni_naslov","meni-uskoro":"meni_uskoro",
    "meni-obj":"meni_objasnjenje","znacka-t":"jezika_broj","h-dogadjaji":"desava_se",
    "d-kviz":"kviz","d-kviz-kad":"kviz_kad","d-film":"film","d-film-kad":"film_kad",
    "h-prostor":"prostor","demo-t":"demo"
  };
  function crtaj(k){
    var j = D.jezici.filter(function(x){return x.k===k;})[0] || D.jezici[0];
    jezik = k; koren.lang = k; koren.dir = j.dir; sel.value = k;
    Object.keys(mapa).forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.textContent = D.ui[mapa[id]][k];
    });
    natpisTeme();
  }
  sel.addEventListener("change", function(){ pisi("blagoje-jezik", sel.value); crtaj(sel.value); sel.blur(); });
  crtaj(pocetni());
})();
</script>
