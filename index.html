<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sajt Servis — primeri</title>
<meta name="description" content="Primeri QR menija i stranica koje pravi Sajt Servis.">
<meta name="theme-color" content="#F4F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F1EB;--ink:#181512;--muted:#5C5650;--raise:#FFF;--zlato:#9A6B12;
      --line:#E2DCD2;--senka:rgba(24,21,18,.08)}
@media (prefers-color-scheme:dark){:root:not([data-tema]){
  --paper:#121110;--ink:#F1ECE3;--muted:#A59C8F;--raise:#1B1917;--zlato:#D9A441;
  --line:#2B2621;--senka:rgba(0,0,0,.45)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Archivo,"Segoe UI",system-ui,sans-serif;
     font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:56px 60px}
h1{margin:0;font-size:clamp(30px,8vw,40px);font-weight:700;letter-spacing:-.03em}
.uvod{margin:10px 0 0;color:var(--muted);font-size:15.5px}
ul{list-style:none;margin:34px 0 0;padding:0;display:flex;flex-direction:column;gap:11px}
a.kart{display:block;text-decoration:none;color:inherit;background:var(--raise);
  border:1px solid var(--line);border-radius:13px;padding:17px 18px;box-shadow:0 1px 3px var(--senka)}
a.kart:hover{border-color:var(--zlato)}
a.kart:focus-visible{outline:2px solid var(--zlato);outline-offset:2px}
.kart b{display:block;font-size:17px;font-weight:600}
.kart span{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted)}
footer a{color:var(--zlato)}
</style>
</head>
<body>
<main>
  <h1>Sajt Servis</h1>
  <p class="uvod">QR meniji i stranice za kafiće. Otvaraju se na svakom telefonu, bez aplikacije, na 10 jezika.</p>
  <ul>
    <li><a class="kart" href="./blagoje/"><b>Blagoje Bistro</b><span>Banovo Brdo — stranica lokala sa podacima i prostorom</span></a></li>
    <li><a class="kart" href="./kafein/"><b>Kafein</b><span>Beograd — QR meni sa cenovnikom</span></a></li>
  </ul>
  <footer>
    <p>Demo primeri. Nisu zvanične stranice objekata.</p>
    <p><a href="https://instagram.com/sajt_servis.rs">@sajt_servis.rs</a></p>
  </footer>
</main>
</body>
</html>
